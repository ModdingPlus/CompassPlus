# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 2.0.1
maven_group = moe.qbyte.compass_plus
archives_name = compass_plus
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 26.1.2
# Game versions tagged on the release sites, per loader; only combinations
# boot-tested with the built jars belong here. The fabric jar spans the whole
# drop; on NeoForge only the final hotfix has a usable ecosystem (NeoForge
# never leaves beta on earlier hotfixes).
fabric_game_versions = 26.1,26.1.1,26.1.2
neoforge_game_versions = 26.1.2

# Dependencies
forge_config_api_port_version = 26.1.5

# Dev environment
mod_menu_version = 18.0.0
fabric_loader_version = 0.19.3
fabric_api_version = 0.155.2+26.1.2
neoforge_version = 26.1.2.87
