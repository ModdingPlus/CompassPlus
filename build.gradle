plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `compass_plus-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
        maven {
            name = 'Fuzs Mod Resources'
            url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        }
        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/releases'
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered {
            it.officialMojangMappings()
            it.parchment("org.parchmentmc.data:parchment-$rootProject.minecraft_version:$rootProject.parchment_version@zip")
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

// Repacks the common api jar under the exact file name the Modrinth maven
// needs for classifier resolution (see the modrinthNeoForge block).
def modrinthApiJar = tasks.register('modrinthApiJar', Jar) {
    def commonApiJar = project(':common').tasks.named('apiJar', Jar)
    dependsOn commonApiJar
    from commonApiJar.map { zipTree(it.archiveFile) }
    destinationDirectory = layout.buildDirectory.dir('modrinthApi')
    archiveFileName = "compass_plus-${mod_version}+neoforge-api.jar"
}

// Uploads the release jars to CurseForge and Modrinth: `./gradlew publishMods`.
// Expects CURSEFORGE_TOKEN / MODRINTH_TOKEN in the environment, falling back to
// gradle properties (e.g. from ~/.gradle/gradle.properties). Set the gradle
// property `publishDryRun` (-PpublishDryRun) to test without uploading.
publishMods {
    changelog = file('CHANGELOG.md').text
    type = STABLE
    dryRun = providers.gradleProperty('publishDryRun').isPresent()

    def fabricJar = project(':fabric').tasks.named('remapJar').flatMap { it.archiveFile }
    def neoforgeJar = project(':neoforge').tasks.named('remapJar').flatMap { it.archiveFile }

    def cfOptions = curseforgeOptions {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
                .orElse(providers.gradleProperty('CURSEFORGE_TOKEN'))
        projectId = '1005106'
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = false
    }

    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
                .orElse(providers.gradleProperty('MODRINTH_TOKEN'))
        projectId = 'xI5eonVo' // compass_plus
        minecraftVersions.add(minecraft_version)
    }

    curseforge('curseforgeFabric') {
        from cfOptions
        file = fabricJar
        modLoaders.add('fabric')
        displayName = "Compass Plus ${mod_version} [Fabric]"
        requires 'fabric-api', 'forge-config-api-port'
        optional 'modmenu'
    }

    curseforge('curseforgeNeoForge') {
        from cfOptions
        file = neoforgeJar
        modLoaders.add('neoforge')
        displayName = "Compass Plus ${mod_version} [NeoForge]"
    }

    modrinth('modrinthFabric') {
        from mrOptions
        file = fabricJar
        modLoaders.add('fabric')
        // unique per-loader version numbers give unambiguous Modrinth maven
        // coordinates (maven.modrinth:compass_plus:<version>+<loader>)
        version = "${mod_version}+fabric"
        displayName = "Compass Plus ${mod_version} [Fabric]"
        requires 'fabric-api', 'forge-config-api-port'
        optional 'modmenu'
    }

    modrinth('modrinthNeoForge') {
        from mrOptions
        file = neoforgeJar
        modLoaders.add('neoforge')
        version = "${mod_version}+neoforge"
        displayName = "Compass Plus ${mod_version} [NeoForge]"
        // the api jar rides along; the Modrinth maven matches additional files
        // by exact name, so maven.modrinth:compass_plus:<version>+neoforge:api
        // requires the file to be named <slug>-<version>+neoforge-api.jar
        additionalFiles.from(modrinthApiJar)
    }
}
