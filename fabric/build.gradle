plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API, needed for the HUD render callback.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Forge Config API Port, runtime provider of the NeoForge config API on Fabric
    api "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$rootProject.forge_config_api_port_version"

    // dev-runtime QoL: mod list + config screen access (FCAP hooks its ported
    // NeoForge ConfigurationScreen into Mod Menu)
    localRuntime "com.terraformersmc:modmenu:$rootProject.mod_menu_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

// With no remapping the shadow jar IS the release jar: it merges this module's
// classes with the transformed common classes under the unclassified name.
jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
    exclude 'architectury.common.json'
}

assemble.dependsOn shadowJar

shadow.addShadowVariantIntoJavaComponent = false

// Fixed debug ports so the VS Code attach configs can find their instance
// when launching via `--debug-jvm`; see .vscode/tasks.json.
tasks.named('runClient') {
    debugOptions {
        port = 5005
    }
}
tasks.named('runServer') {
    debugOptions {
        port = 5006
    }
}
